@if (modals.isOpen('activity-form')) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/30 px-4 py-6">
    <div
      class="w-full max-w-2xl bg-base-100 rounded-[var(--az-radius-lg)] border border-base-300 flex flex-col max-h-[90vh]">
      <div class="px-6 py-4 border-b border-base-300">
        <h2 class="text-lg font-semibold">
          {{ isEdit() ? 'Modifier l’activité' : 'Nouvelle activité' }}
        </h2>
      </div>

      <div class="px-6 py-4 overflow-y-auto grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div class="sm:col-span-2">
          <label class="block text-sm font-medium mb-1">Titre *</label>
          <input type="text" class="input input-bordered w-full"
            [ngModel]="title()" (ngModelChange)="title.set($event)" />
        </div>

        <div class="sm:col-span-2">
          <label class="block text-sm font-medium mb-1">Description *</label>
          <textarea class="textarea textarea-bordered w-full" rows="3"
            [ngModel]="description()" (ngModelChange)="description.set($event)"></textarea>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Catégorie *</label>
          <select class="select select-bordered w-full"
            [ngModel]="categoryId()" (ngModelChange)="categoryId.set($event)">
            <option value="" disabled>Choisir…</option>
            @for (c of categories.categories(); track c.id) {
              <option [value]="c.id">{{ c.label }}</option>
            }
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Lieu *</label>
          <input type="text" class="input input-bordered w-full"
            [ngModel]="location()" (ngModelChange)="location.set($event)" />
        </div>

        <div class="sm:col-span-2">
          <label class="block text-sm font-medium mb-1">Organisateur</label>
          <select class="select select-bordered w-full"
            [ngModel]="organizerId()" (ngModelChange)="organizerId.set($event)">
            <option value="">— Aucun —</option>
            @for (o of organizers.organizers(); track o.id) {
              <option [value]="o.id">{{ o.name }}</option>
            }
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Début *</label>
          <input type="datetime-local" class="input input-bordered w-full"
            [ngModel]="startsAt()" (ngModelChange)="startsAt.set($event)" />
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Fin</label>
          <input type="datetime-local" class="input input-bordered w-full"
            [ngModel]="endsAt()" (ngModelChange)="endsAt.set($event)" />
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Cœurs (récompense)</label>
          <input type="number" min="0" class="input input-bordered w-full"
            [ngModel]="heartsReward()" (ngModelChange)="heartsReward.set($event)" />
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Places max *</label>
          <input type="number" min="1" class="input input-bordered w-full"
            [ngModel]="maxParticipants()" (ngModelChange)="maxParticipants.set($event)" />
        </div>

        <div class="sm:col-span-2">
          <label class="block text-sm font-medium mb-1">Image (URL) *</label>
          <input type="text" class="input input-bordered w-full" placeholder="https://…"
            [ngModel]="imageUrl()" (ngModelChange)="imageUrl.set($event)" />
        </div>

        <div class="sm:col-span-2">
          <label class="block text-sm font-medium mb-1">Lien d'inscription (Google Form)</label>
          <input type="text" class="input input-bordered w-full" placeholder="https://forms.gle/…"
            [ngModel]="registrationUrl()" (ngModelChange)="registrationUrl.set($event)" />
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Date limite d'inscription</label>
          <input type="datetime-local" class="input input-bordered w-full"
            [ngModel]="registrationDeadline()" (ngModelChange)="registrationDeadline.set($event)" />
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Statut</label>
          <select class="select select-bordered w-full"
            [ngModel]="status()" (ngModelChange)="status.set($event)">
            <option value="draft">Brouillon</option>
            <option value="published">Publiée</option>
            @if (isEdit()) {
              <option value="archived">Archivée</option>
            }
          </select>
        </div>

        <div class="sm:col-span-2">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" class="checkbox checkbox-sm"
              [ngModel]="isFeatured()" (ngModelChange)="isFeatured.set($event)" />
            <span class="text-sm">Mettre à la une (carrousel)</span>
          </label>
        </div>
      </div>

      <div class="px-6 py-4 border-t border-base-300 flex justify-end gap-2">
        <button type="button" class="btn btn-ghost btn-sm" (click)="close()">Annuler</button>
        <button type="button" class="btn btn-primary btn-sm"
          [disabled]="save.isSaving()" (click)="submit()">
          @if (save.isSaving()) {
            <span class="loading loading-spinner loading-xs"></span>
          }
          {{ isEdit() ? 'Enregistrer' : 'Créer' }}
        </button>
      </div>
    </div>
  </div>
}
