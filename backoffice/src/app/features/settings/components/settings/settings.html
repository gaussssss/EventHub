<div class="flex flex-col gap-5">
  <div>
    <h1 class="text-2xl font-semibold">Paramètres</h1>
    <p class="text-sm text-base-content/60 mt-0.5">Gamification — seuils de niveaux et récompenses.</p>
  </div>

  <!-- Chargement -->
  @if (load.isLoading() && !states.gamification()) {
    <div class="flex justify-center py-16">
      <span class="loading loading-spinner loading-lg text-primary"></span>
    </div>
  }

  @if (states.gamification()) {
    <div class="bg-base-100 border border-base-300 rounded-[var(--az-radius-lg)] p-6 max-w-xl">
      <h2 class="text-base font-semibold mb-4">Seuils de niveaux (cœurs cumulés)</h2>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-medium mb-1">🥉 Bronze</label>
          <input type="number" class="input input-bordered w-full" [value]="states.gamification()?.bronzeThreshold" disabled />
          <p class="text-xs text-base-content/40 mt-1">Fixe (départ)</p>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">🥈 Argent</label>
          <input type="number" min="0" class="input input-bordered w-full"
            [ngModel]="silver()" (ngModelChange)="silver.set($event)" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">🥇 Or</label>
          <input type="number" min="0" class="input input-bordered w-full"
            [ngModel]="gold()" (ngModelChange)="gold.set($event)" />
        </div>
      </div>

      <div class="divider my-5"></div>

      <h2 class="text-base font-semibold mb-4">Récompense</h2>
      <div class="max-w-xs">
        <label class="block text-sm font-medium mb-1">Cœurs par présence (défaut)</label>
        <input type="number" min="0" class="input input-bordered w-full"
          [ngModel]="reward()" (ngModelChange)="reward.set($event)" />
        <p class="text-xs text-base-content/40 mt-1">
          Attribués quand une présence est confirmée, sauf récompense propre à l'activité.
        </p>
      </div>

      <div class="mt-6 flex justify-end">
        <button class="btn btn-primary btn-sm gap-1" [disabled]="save.isSaving()" (click)="submit()">
          @if (save.isSaving()) {
            <span class="loading loading-spinner loading-xs"></span>
          }
          Enregistrer
        </button>
      </div>
    </div>
  }
</div>
